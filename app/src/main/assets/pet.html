<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>草编小狗</title>
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.pet-container {
  width: 180px;
  height: 240px;
  position: relative;
  cursor: pointer;
}
.pet-svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
.pet-group {
  transition: transform 0.1s ease;
}
.pet-blink {
  animation: blink 4s infinite;
}
@keyframes blink {
  0%, 48%, 52%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.2); }
}
.pet-tail {
  animation: tail-wag 1.5s infinite ease-in-out;
  transform-origin: 20px 60px;
}
@keyframes tail-wag {
  0%, 100% { transform: rotate(-10deg); }
  50% { transform: rotate(10deg); }
}
.pet-speech-bubble {
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.9);
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 12px;
  color: #333;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.pet-speech-bubble.show {
  opacity: 1;
}
.pet-speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid rgba(255,255,255,0.9);
}
.pet-cangry {
  animation: shake 0.5s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
</style>
</head>
<body>
<div class="pet-container" id="petContainer">
  <div class="pet-speech-bubble" id="speechBubble"></div>
  <svg class="pet-svg" viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景层：透明 -->
    
    <!-- 身体草编质感 -->
    <g id="petBody" class="pet-group">
      <!-- 身体主体（草编棕色） -->
      <path d="M60,120 Q60,80 90,70 Q120,80 120,120 Q130,130 130,150 Q130,180 110,190 Q90,200 70,190 Q50,180 50,150 Q50,130 60,120 Z" 
            fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
      <!-- 身体纹理（草编纹理） -->
      <path d="M65,130 Q70,120 80,125 Q85,130 85,140 Q80,145 75,140 Q70,135 65,135 Z" fill="#A08260" opacity="0.3"/>
      <path d="M95,130 Q105,125 110,135 Q105,145 95,140 Q85,135 95,130 Z" fill="#A08260" opacity="0.3"/>
      
      <!-- 左耳 -->
      <ellipse cx="70" cy="80" rx="12" ry="20" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
      <!-- 右耳 -->
      <ellipse cx="110" cy="80" rx="12" ry="20" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
      
      <!-- 鼻子 -->
      <ellipse cx="90" cy="110" rx="8" ry="6" fill="#3E2723" stroke="#2D1B18" stroke-width="1"/>
      
      <!-- 嘴巴 -->
      <path d="M85,120 Q90,125 95,120" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- 眼睛（眨眼动画） -->
    <g id="petEyes" class="pet-group pet-blink">
      <!-- 左眼 -->
      <circle cx="75" cy="95" r="5" fill="white" stroke="#333" stroke-width="1"/>
      <circle cx="76" cy="95" r="2" fill="black"/>
      <!-- 右眼 -->
      <circle cx="105" cy="95" r="5" fill="white" stroke="#333" stroke-width="1"/>
      <circle cx="106" cy="95" r="2" fill="black"/>
    </g>
    
    <!-- 头顶小鸟 -->
    <g id="petBird" transform="translate(90,60)">
      <!-- 小鸟身体 -->
      <ellipse rx="10" ry="12" fill="#FFD54F" stroke="#FFB300" stroke-width="1"/>
      <!-- 小鸟喙 -->
      <path d="M8,0 L15,2 L8,4 Z" fill="#FF9800"/>
      <!-- 小鸟眼睛 -->
      <circle cx="6" cy="-2" r="2" fill="black"/>
      <!-- 小鸟翅膀 -->
      <path d="M0,2 Q-5,5 0,8 Q5,5 0,2" fill="#FFB300" opacity="0.7"/>
    </g>
    
    <!-- 尾巴（摆动） -->
    <g id="petTail" class="pet-tail">
      <path d="M130,160 Q150,170 160,150 Q150,130 130,140 Z" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
    </g>
    
    <!-- 四肢 -->
    <g id="petLegs">
      <!-- 左前腿 -->
      <path d="M70,150 L65,190 L68,195 L72,190 Z" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
      <!-- 右前腿 -->
      <path d="M110,150 L115,190 L112,195 L108,190 Z" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
      <!-- 左后腿 -->
      <path d="M60,155 L50,185 L53,190 L58,185 Z" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
      <!-- 右后腿 -->
      <path d="M120,155 L130,185 L127,190 L122,185 Z" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
    </g>
    
    <!-- 表情变化层（通过class切换） -->
    <g id="petAngry" style="display:none;">
      <!-- 愤怒眉毛 -->
      <path d="M70,85 L75,90" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <path d="M100,85 L105,90" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    </g>
  </svg>
</div>

<script>
// ========== Engine Interface ============
const petEngine = {
  onTap: function() {
    showSpeech('汪！');
    triggerReaction('tap');
    window.Android?.reportGesture('tap');
    playAnimation('wiggle');
  },
  
  onDoubleTap: function() {
    showSpeech('嘿嘿~');
    triggerReaction('doubleTap');
    window.Android?.reportGesture('double_tap');
    playAnimation('jump');
  },
  
  onLongPress: function() {
    showSpeech('摸摸～');
    triggerReaction('longPress');
    window.Android?.reportGesture('long_press');
    playAnimation('stretch');
  },
  
  onFling: function(x, y) {
    showSpeech('回来啦！');
    triggerReaction('fling');
    window.Android?.reportGesture('fling');
    playAnimation('flyBack');
  },
  
  onDragEnd: function() {
    showSpeech('贴贴～');
    triggerReaction('drag');
    window.Android?.reportGesture('drag');
  },
  
  onScreenshot: function() {
    showSpeech('咔嚓！');
    triggerReaction('screenshot');
    window.Android?.reportGesture('screenshot');
    playAnimation('pose');
  },
  
  // External command from AI (via Supabase)
  command: function(action, value) {
    switch(action) {
      case 'setMood':
        setMood(value);
        break;
      case 'showBubble':
        showSpeech(value);
        break;
      case 'playAnim':
        playAnimation(value);
        break;
      case 'wake':
        playAnimation('wakeUp');
        break;
    }
  }
};

// ========== UI Functions ============
function showSpeech(text) {
  const bubble = document.getElementById('speechBubble');
  bubble.textContent = text;
  bubble.classList.add('show');
  setTimeout(() => bubble.classList.remove('show'), 2000);
}

function triggerReaction(type) {
  console.log('Pet reaction:', type);
  // Could log to backend here
}

function setMood(mood) {
  const body = document.getElementById('petBody');
  const eyes = document.getElementById('petEyes');
  const tail = document.getElementById('petTail');
  
  switch(mood) {
    case 'happy':
      body.style.filter = 'drop-shadow(0 0 10px rgba(255,215,79,0.5))';
      break;
    case 'sleep':
      document.getElementById('petEyes').style.display = 'none';
      tail.style.opacity = '0.5';
      break;
    case 'angry':
      document.getElementById('petAngry').style.display = 'block';
      body.classList.add('pet-cangry');
      setTimeout(() => body.classList.remove('pet-cangry'), 500);
      break;
    default:
      body.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.2))';
  }
}

function playAnimation(name) {
  const body = document.getElementById('petBody');
  body.style.transition = 'transform 0.3s ease';
  
  switch(name) {
    case 'wiggle':
      body.style.transform = 'rotate(5deg)';
      setTimeout(() => body.style.transform = 'rotate(-5deg)', 150);
      setTimeout(() => body.style.transform = 'rotate(0)', 300);
      break;
    case 'jump':
      body.style.transform = 'translateY(-20px) scale(1.1)';
      setTimeout(() => body.style.transform = 'translateY(0) scale(1)', 300);
      break;
    case 'stretch':
      body.style.transform = 'scaleX(1.2)';
      setTimeout(() => body.style.transform = 'scaleX(1)', 500);
      break;
    case 'flyBack':
      body.style.transition = 'all 1s ease';
      body.style.transform = 'translateX(-100px)';
      setTimeout(() => {
        body.style.transition = 'all 0.5s ease';
        body.style.transform = 'translateX(0)';
      }, 500);
      break;
    case 'pose':
      body.style.transform = 'scale(1.1)';
      setTimeout(() => body.style.transform = 'scale(1)', 200);
      break;
    case 'wakeUp':
      playAnimation('jump');
      showSpeech('起床啦～');
      break;
    default:
      break;
  }
}

// ========== Gesture Handlers ============
const container = document.getElementById('petContainer');
let initialX = 0;
let initialY = 0;
let touchStartTime = 0;
let hasMoved = false;
let lastTapTime = 0;

container.addEventListener('touchstart', function(e) {
  e.preventDefault();
  initialX = e.touches[0].clientX;
  initialY = e.touches[0].clientY;
  touchStartTime = Date.now();
  hasMoved = false;
}, {passive: false});

container.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (hasMoved) return;
  const moveX = e.touches[0].clientX - initialX;
  const moveY = e.touches[0].clientY - initialY;
  if (Math.abs(moveX) > 10 || Math.abs(moveY) > 10) {
    hasMoved = true;
    container.style.position = 'fixed';
    container.style.left = (initialX + moveX) + 'px';
    container.style.top = (initialY + moveY) + 'px';
  }
}, {passive: false});

container.addEventListener('touchend', function(e) {
  e.preventDefault();
  const elapsed = Date.now() - touchStartTime;
  
  if (!hasMoved) {
    if (elapsed > 600) {
      petEngine.onLongPress();
    } else if (Date.now() - lastTapTime < 300) {
      petEngine.onDoubleTap();
    } else {
      petEngine.onTap();
    }
    lastTapTime = Date.now();
  } else {
    // Drag ended - check if it was a fling
    const containerRect = container.getBoundingClientRect();
    const petX = containerRect.left + container.offsetWidth / 2;
    const petY = containerRect.top + container.offsetHeight / 2;
    // Simple fling detection
    petEngine.onDragEnd();
  }
  
  container.style.position = 'relative';
  container.style.left = '0';
  container.style.top = '0';
  container.style.transform = '';
}, {passive: false});

// ========== Supabase Polling ============
async function pollState() {
  try {
    const response = await fetch('https://giqjvwczceugdkteexhv.supabase.co/rest/v1/pet_state?order=updated_at.desc&limit=1', {
      headers: {
        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpcWp2d2N6Y2V1Z2RrdGVleGh2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NTIyMDk0NCwiZXhwIjoyMTAwNzk2OTQ0fQ.yd-Ejpx9AeFCiHuBzUpIUfiIwqmXTUgWhA25dyHnsG4',
        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpcWp2d2N6Y2V1Z2RrdGVleGh2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NTIyMDk0NCwiZXhwIjoyMTAwNzk2OTQ0fQ.yd-Ejpx9AeFCiHuBzUpIUfiIwqmXTUgWhA25dyHnsG4'
      }
    });
    const data = await response.json();
    if (data.length > 0 && data[0].state_key === 'mood') {
      setMood(data[0].state_value);
    }
    if (data.length > 0 && data[0].state_key === 'bubble') {
      showSpeech(data[0].state_value);
    }
  } catch(e) {
    console.log('Polling error:', e);
  }
}

setInterval(pollState, 30000);

// Expose to Android
window.petEngine = petEngine;
window.Android = {
  reportGesture: function(type) {
    // Android will handle this via evaluateJavascript
    console.log('Gesture:', type);
  }
};

// Initial wake-up animation
setTimeout(() => {
  petEngine.command('playAnim', 'wakeUp');
}, 1000);
</script>
</body>
</html>
